# Investment guidelines for Global Balanced (GBL-BAL), as agreed with the client.
#
# This is the client's mandate, checked after trading with
#
#     python -m folio.compliance check
#
# It is not the desk's limits file: those live in folio's settings ([limits])
# and the desk may tighten them at will. This file changes only when the
# client signs a new schedule. docs/compliance.md explains every guideline.
#
# Each guideline is a table with `value` and an optional `note` saying where
# it comes from in the agreement. `enabled = false` switches one off while
# keeping its value on record. Shares are fractions of NAV: 0.07 is 7%.

[mandate]
portfolio = "GBL-BAL"
client = "Ellesmere Staff Pension Scheme"

[guidelines.issuer_max_share]
value = 0.07
note = "Schedule 2, para 1: any one issuer"

[guidelines.country_max_share]
value = 0.30
note = "Schedule 2, para 2: country of the issuer"

[guidelines.fund_max_share]
value = 0.10
note = "Schedule 2, para 3: any one fund"

[guidelines.govt_min_share]
value = 0.15
note = "Schedule 3, para 1: government bond floor"

[guidelines.max_positions]
value = 40
note = "Schedule 3, para 2"

[guidelines.min_cash_share]
value = 0.02
note = "Schedule 3, para 3: cash for withdrawals"

# No value: nothing on restricted.csv may be held at all.
[guidelines.restricted_holdings]
note = "Schedule 4: trustees' exclusion list"
