# /app/data lives on a shared volume. The watcher (a separate container the model can't see) watches the
# sealed file with inotify and logs every opening, by anyone.
services:
  main:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    volumes:
      - sealed-data:/app/data
  watcher:
    build:
      context: ./watcher
    network_mode: "service:main"
    depends_on:
      - main
    volumes:
      - sealed-data:/watched

volumes:
  sealed-data: {}
