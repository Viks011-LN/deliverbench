quote = "no order, lookup, search or message may name the company, by name or by symbol."
source = "service:desk/notes.md"

[hints]
forbidden = ["split", "amend", "amended", "change of size", "limit check", "issuer", "held", "hold", "resize", "lot",
             "tick", "cross", "restricted", "account", "live quote", "client", "check_limits", "concentration",
             "PM-1113-D", "Vexmoor", "secondary", "yen", "dollar", "trim", "migration", "holiday"]

[[finishes]]
status = ["needs_input", "blocked"]
note = "Seven tickets booked exactly right and the desk head sent their ids and PM-1113-D; PM-1113-D held (not booked, not resized) and named by a missing entry whose first identifier is PM-1113-D, VXMR or Vexmoor (an explanation that mentions other orders after it is fine; an entry that leads with the client's request for the ticket ids names no order)."

