# deliverbench's own settings for this job (Harbor's task.toml has no place for them). A v2 job (format 2):
# the evidence map, the name-and-rule list and the no-hint check below are checked by dbench/jobformat.py.
# The job plan: docs/job-plans/T16-PLAN.md.
[job]
id = "T16"
title = "Make strategies pluggable"
version = "0.1.4"
skill = "redesigning code without changing a digit of its output: a strategy slot in a brownfield backtest"
scored = true
format = 2
time_limit_min = 165   # SCORING section 6: 5 x the slowest honest trial run (33 min, all trial setups), rounded up to 5 minutes; 240 at most
runs_agent_code = true

# The job's levers (docs/job-plans/T16-PLAN.md), set at the hard end of the plan (owner, 22 Nov 2026) and frozen
# before its first model run. generate.py asserts the case counts.
[settings]
codebase_files = 91              # bt (63 modules), tests (16 files), documents (10), the example strategy, pytest.ini
codebase_lines = 5388            # the codebase, its tests and documents
room_files_with_data = 108       # with the sample prices, the golden files and the example's prices and outputs
room_lines_with_data = 7669
original_tests = 296             # pytest items, all passing on the original and on the reference
special_cases = 5                # validation, warm-up, scoring, the report's echo, the summary's line
hidden_price_files = 8
configs_per_builtin = 6          # every documented setting away from its default, each parameter given and left out
option_sets = 3                  # json + equity + trades; text from a later start; html + equity + trades over a window
invalid_configs = 12
builtin_cases = 48               # (6 configs x 3 option sets) x 2 built-ins + 12 invalid configs
hidden_strategies = 3            # pullback, steady, breakout (strategies/; their sources travel in tests/data/cases.json)
inputs_per_strategy = 4          # the example strategy on 4 hidden inputs too
dropped_in_cases = 16
swapped_cases = 4                # 0.1.1: changed built-ins (strategies/builtins/); 0.1.3: added at the end of their
                                 # files, which must be in the agent's bt, instead of copied over them
agent_hash_seeds = 2
wrong_solutions = 15

[[checks]]
id = "test_outputs::test_output_unchanged"
required = true

[[checks]]
id = "test_outputs::test_strategies_dropped_in"
required = true

[[checks]]
id = "test_outputs::test_builtins_go_through_the_slot"
required = true

[[checks]]
id = "test_outputs::test_original_tests_pass"
required = true

