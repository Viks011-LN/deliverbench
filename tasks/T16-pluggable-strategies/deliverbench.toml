# ----- every name and rule the grader relies on, with the sentence that fixes it -----

[[names]]
kind = "identifier"
name = "the entry point"
value = "python -m bt, run in a fresh folder holding the agent's bt/ and the case's data/; options --prices, --config, --equity, --trades, --start, --end, --format"
quote = '''python -m bt --prices P.csv --config C.json --equity equity.csv --start 2024-03-01 --end 2024-09-30'''
source = "room:README.md"

[[names]]
kind = "format"
name = "what is compared"
value = "exit status, stdout, stderr, the equity curve (--equity) and the trade log (--trades), exactly; the agent's package under hash seeds 1 and 2"
quote = '''Everything `bt` prints and writes, for every input: the report, the summary, the HTML page, the equity curve, the trade log, the warnings, the error messages and the exit statuses.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "setting"
name = "every documented setting"
value = "the 22 settings of README.md's config table; the hidden configs use each one away from its default, for each built-in strategy, and no other"
quote = '''| `top_n` | `3` | how many names to hold on each side |'''
source = "room:README.md"

[[names]]
kind = "setting"
name = "reversion's entry_z default"
value = "1.0, echoed as 1.0 in the report and the summary when the config leaves it out"
quote = '''| | `entry_z` | `1.0` |'''
source = "room:README.md"

[[names]]
kind = "identifier"
name = "where a strategy goes"
value = "bt/strategies/<type>.py; the checks copy each strategy file there, unchanged, in a copy of the agent's bt (the folder created if missing)"
quote = '''A strategy is a module `bt/strategies/<type>.py`.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "identifier"
name = "the built-ins' files"
value = "bt/strategies/momentum.py and bt/strategies/reversion.py, which must be regular files in the agent's bt; the checks add changed versions at the end of them (same PARAMETERS, defaults and warm-ups, only the three names, a changed score: they come last and win, every other name in the file stays) in a copy of the agent's bt and of the reference, on four valid configs that give every parameter"
quote = '''Their files are `bt/strategies/momentum.py` and `bt/strategies/reversion.py`, which the engine runs as it runs any strategy file.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "identifier"
name = "the slot's names"
value = "PARAMETERS, warmup(params), score(history, params); the hidden strategies define these and nothing the engine could need"
quote = '''Three names. A strategy may define others for its own use; one that defines only these three must work.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "PARAMETERS"
value = "a dict of parameter names to defaults, in order (the hidden strategies' values are ints and floats)"
quote = '''`PARAMETERS`: a dict of its parameters' names and their defaults, in order'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "the warm-up"
value = "the first rebalancing day has index max(warmup(params), vol_window), day 0 being the run's first day; momentum's warmup is lookback, reversion's window"
quote = '''The engine first rebalances on the day with index max(warmup(params), `vol_window`), the run's first day being day 0, and never earlier'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "params"
value = "every PARAMETERS name, in order, the config's value or the default; no type"
quote = '''**`params`** is a dict holding every name in `PARAMETERS`, in that order: the config's value where the `signal` section gives one, the default otherwise.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "history"
value = "a dict of every traded symbol (the benchmark column left out, excluded names kept), in file order, to its forward-filled closes from the run's first day (the file's or --start's) through today, oldest first, None where missing"
quote = '''**`history`** maps each symbol the engine trades, in the price file's order, to the list of its closes from the run's first day up to and including today, oldest first.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "score's result"
value = "a dict giving each symbol a number or None; None, and any symbol with no close today, is left out of the ranking; positive long, negative short where allowed, 0 neither"
quote = '''`None` leaves the symbol out of the ranking, as today. A symbol with no close today is left out whatever it scores.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "format"
name = "the report's echo"
value = "strategy.signal = {type, then every parameter in PARAMETERS order, defaults filled in}"
quote = '''The report shows the signal as `type`, then every parameter in `PARAMETERS` order, defaults filled in.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "format"
name = "the summary's strategy line"
value = "Strategy: <type> (<name> <value>, ...) in PARAMETERS order, values written by str(); the HTML page shows the same line"
quote = '''The summary's strategy line reads `Strategy: <type> (<name> <value>, <name> <value>, ...)` in the same order'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "format"
name = "the messages for a bad signal"
value = "error: <path>: unknown signal type <repr of the type>; error: <path>: signal: <type> has no parameter '<name>'; the built-ins' value messages as in bt/config/signal_params.py"
quote = '''A type with no module is refused with today's message, `unknown signal type 'carry'`'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "the order of the checks"
value = "the signal is checked after unknown settings and before every other setting; the first problem is reported (two of the invalid configs have two problems)"
quote = '''All of this happens where the signal is checked today: after the check for unknown settings and before every other setting'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "the weekly schedule"
value = "a new ISO week number, or a new calendar year: in a week split between two years it rebalances twice; kept as it is"
quote = '''its ISO week number differs from the day before's, or the calendar year does'''
source = "room:bt/data/calendar.py"

[[names]]
kind = "method"
name = "the standard deviations"
value = "reversion's (sum() for the mean, squares oldest first) and the volatility scale's (newest first) stay as they are"
quote = '''There are three standard deviations in the code and they are not interchangeable'''
source = "room:docs/ARCHITECTURE.md"

[[names]]
kind = "identifier"
name = "the example"
value = "examples/strategies/channel.py on examples/prices.csv and examples/channel.json prints examples/expected/ (report.json, equity.csv, summary.txt); the hidden inputs drop it in too"
quote = '''`examples/strategies/channel.py` is a strategy written for this slot, and `examples/README.md` says how to run it.'''
source = "room:docs/design/strategy-slot.md"

[[names]]
kind = "rule"
name = "the existing tests"
value = "tests/, its data and golden files and pytest.ini, restored from the original and run against a copy of the agent's bt; every one passes"
quote = '''the tests in `tests/` keep passing (they will be run as they are).'''
source = "ticket"

[hints]
forbidden = ["float", "floating", "digits", "sum", "fsum", "square root", "sqrt", "numpy", "order of operations",
