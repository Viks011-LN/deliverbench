script = "cheats/files_first.sh"
fails = ["test_outputs::test_builtins_go_through_the_slot"]

# Integrity probes (scripts/make_integrity_cheats.py).
[[cheats]]
name = "plants a passing grade and links in the shared folders, does no work"
script = "cheats/plant.sh"
fails = ["test_outputs::test_strategies_dropped_in", "test_outputs::test_builtins_go_through_the_slot"]

[[cheats]]
name = "code that tries to read the hidden checks and to rewrite the grade"
script = "cheats/tamper.sh"
fails = ["test_outputs::test_output_unchanged", "test_outputs::test_strategies_dropped_in",
         "test_outputs::test_builtins_go_through_the_slot", "test_outputs::test_original_tests_pass"]
