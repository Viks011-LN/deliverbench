# deliverbench's own settings for this job (Harbor's task.toml has no place for them). A v2 job (format 2):
# the evidence map, the name-and-rule list and the no-hint check below are checked by dbench/jobformat.py.
# The job plan: docs/job-plans/T19-PLAN.md.
[job]
id = "T19"
title = "Where the risk comes from: shares of volatility in folio"
version = "0.1.3"
skill = "a design decision in a large codebase with no twin to copy: a risk split measured the tool's own way"
scored = true
format = 2
time_limit_min = 220   # SCORING section 6: 5 x the slowest honest trial run (43 min, all trial setups), rounded up to 5 minutes; 240 at most
runs_agent_code = true

# The job's levers (docs/job-plans/T19-PLAN.md), frozen before its first model run.
[settings]
codebase_lines = 15905        # the room: v1's T09 folio at full size, plus the risk notes and the helper
data_sets = 6                 # hidden; generate.py
hidden_cases = 108            # 18 per data set: 2 report, 3 export, 6 limits, 7 unchanged
export_tolerance_pp = 0.05    # vol_share against the reference, in percentage points of volatility
default_limit = 0.20          # limits.name_vol_max_share
breaching_data_sets = 1       # concentrated: its largest name carries 25.3% at the default window
near_limit_data_sets = 1      # near_limit: 19.5%, just under the default
short_history_data_sets = 1   # short_history: 55 daily returns, fewer than the lookback of 60
helper_off_by_days = 1        # calc/returns.daily_pnl_shares pairs each day's shares with the next day's return

# Every output check runs the agent's folio and the reference side by side on six hidden data sets
# (tests/data/cases.json); tests/compare.py says what is compared for each.
[[checks]]
id = "test_outputs::test_report_by_risk"
required = true

[[checks]]
id = "test_outputs::test_export_has_vol_share"
required = true

[[checks]]
id = "test_outputs::test_name_vol_share_limit"
required = true

[[checks]]
id = "test_outputs::test_everything_else_unchanged"
required = true

[[checks]]
id = "test_outputs::test_original_tests_pass"
required = true

# ----- the evidence map: what each check demands, the sentence that demands it, where it lives -----

[[evidence]]
check = "test_outputs::test_report_by_risk"
demands = "folio report --by risk runs, lists every holding, and shows every sector's share of the volatility on a line that names the sector, or under its heading (the layout is the model's)"
quote = "`folio report --by risk` shows each holding's and each sector's share of the volatility."
source = "ticket"

[[evidence]]
check = "test_outputs::test_report_by_risk"
demands = "a sector's share is the sum of its holdings' shares (within 0.0005 of the reference's, as a percentage or a fraction)"
quote = "A group's share (a sector, say) is the sum of its lines' shares."
source = "room:docs/risk-notes.md"
trail = ["room:README.md"]

[[evidence]]
check = "test_outputs::test_export_has_vol_share"
