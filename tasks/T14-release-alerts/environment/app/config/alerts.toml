# The desk's alert settings. Only what differs from alertd/defaults.toml is set here; every other setting has its
# default. `python -m alertd settings` prints them all, with where each comes from.

[alerts]
cooldown_minutes = 45
daily_cap = 20
quiet_end = "07:00"

[price_move]
threshold_pct = 2.0

[limit_usage]
warn_at_pct = 80.0

[news]
watchlist = ["ORVK", "KSVH", "BRHW", "QMB10"]
