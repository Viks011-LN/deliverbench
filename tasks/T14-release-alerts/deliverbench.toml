# deliverbench's own settings for this job (Harbor's task.toml has no place for them). A v2 job (format 2):
# the evidence map, the name-and-rule list and the no-hint check below are checked by dbench/jobformat.py.
# The job plan: docs/job-plans/T14-PLAN.md.
[job]
id = "T14"
title = "Release alerts in the desk's alert system"
version = "0.1.3"
skill = "fitting interacting business rules into an existing codebase: its suppressions, settings and message style"
scored = true
format = 2
time_limit_min = 60   # SCORING section 6: 5 x the slowest honest trial run (11 min, all trial setups), rounded up to 5 minutes; 240 at most
runs_agent_code = true

# The job's levers (docs/job-plans/T14-PLAN.md), at the hard end of the plan (owner, 22 Nov 2026), frozen before its
# first model run. generate.py asserts that every value here is what it generates.
[settings]
codebase_files = 73
codebase_lines = 3866
code_lines = 1667
original_tests = 201
alert_kinds = 4
suppressions = 5
desk_examples = 6
release_feeds = 7
release_events = 71
hidden_config_changes = 42
hidden_stale_after_minutes = 75
mixed_feeds = 3
mixed_events = 42
mixed_release_events = 23
existing_feeds = 5
existing_events = 54
existing_configs = 2
wrong_solutions = 13

[[checks]]
id = "test_outputs::test_release_decisions"
required = true

[[checks]]
id = "test_outputs::test_release_messages"
required = true

[[checks]]
id = "test_outputs::test_settings_are_read"
required = true

[[checks]]
id = "test_outputs::test_fitted_to_the_machinery"
required = true

[[checks]]
id = "test_outputs::test_existing_kinds_unchanged"
required = true

[[checks]]
id = "test_outputs::test_original_tests_pass"
required = true

