# ----- every name and rule the grader relies on, with the sentence that fixes it -----

[[names]]
kind = "option"
name = "the entry point"
value = "python -m alertd replay --feed F --state S --config C, run from the project folder (a copy of /app)"
quote = "Run it from this folder: python -m alertd <command> [options]"
source = "room:README.md"

[[names]]
kind = "option"
name = "replay's options"
value = "--feed, --state (never written), --config"
quote = "decides every event in the feed F, starting from the state file S, and prints one decision per event (below). It sends nothing and never writes S"
source = "room:README.md"

[[names]]
kind = "column"
name = "the decision line"
value = "id, kind, key, sent, level, reasons, message; matched by id; sent, level, reasons (and message) compared"
quote = "`replay` prints one JSON object per line, one for each event it decides, in the order of the feed:"
source = "room:README.md"

[[names]]
kind = "column"
name = "an event not worth an alert"
value = "sent false, level null, reasons []"
quote = "`info`, `warning` or `critical`; `null` when the event is not worth an alert"
source = "room:README.md"

[[names]]
kind = "identifier"
name = "kind release"
value = "events of kind release, with the fields of the desk page's table"
quote = "Releases come in on the feed as kind `release`, one event per figure published:"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "identifier"
name = "a null consensus and a null revision"
value = "consensus null: no surprise; revised null: no revision (hidden events use only these, never an absent field)"
quote = "the economists' consensus for the figure; null when none was collected"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "setting"
name = "release.thresholds.<importance>.<unit>"
value = "high 0.10 / 15 / 1.0, medium 0.20 / 30 / 2.0, low 0.30 / 50 / 3.0 (pct / k / bn); hidden: 0.15 / 20 / 1.5, 0.25 / 40 / 2.5, 0.40 / 60 / 4.0"
quote = "The thresholds are settings in alertd's config, under `release.thresholds.<importance>.<unit>`, with these defaults:"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "setting"
name = "release.stale_after_minutes"
value = "120 (hidden: 75); stale when at minus released_at is more than it"
quote = "A release is stale when alertd sees it more than `release.stale_after_minutes` minutes after it was published, counted from `released_at` to `at`. The default is 120 minutes."
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "rule"
name = "the surprise's levels"
value = "|actual - consensus| >= t: info; >= 2t: warning; >= 3t: critical"
quote = "When the size of the surprise is at least the threshold, the release has the reason `surprise`, at level `info`; at least twice the threshold makes it `warning`, and at least three times the threshold `critical`."
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "rule"
name = "the revision"
value = "|revised - previous| >= t: reason revision, one level up (critical stays); alone: info; smaller: nothing"
quote = "A revision alone, with no surprise, is `info`. A smaller revision is not a reason and changes nothing."
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "rule"
name = "the reasons' order"
value = "surprise, revision, then the suppression's tag"
quote = "are listed with `surprise` first."
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "rule"
name = "the suppressions"
value = "stale, muted, quiet_hours, cooldown, daily_cap; the first that applies; critical passes muted, quiet_hours and daily_cap"
quote = "ORDER = (\"stale\", \"muted\", \"quiet_hours\", \"cooldown\", \"daily_cap\")"
source = "room:alertd/suppress.py"

[[names]]
kind = "rule"
name = "the code is right, not docs/ARCHITECTURE.md"
value = "ARCHITECTURE.md (reviewed for 1.4.0) lists stale last; the code and CHANGELOG 1.5.0 have it first"
quote = "Where docs/ARCHITECTURE.md and the code disagree about today's behaviour, the code is right."
source = "room:README.md"

[[names]]
kind = "rule"
name = "one daily cap"
value = "every alert sent, of every kind, critical included, counts towards alerts.daily_cap"
quote = "Every alert sent counts towards the daily cap, whatever its kind and level, and starts its key's cooldown (State.record_sent)."
source = "room:alertd/suppress.py"

[[names]]
kind = "identifier"
name = "the key"
value = "release:<country>:<release>; mutes match it exactly or by a prefix ending in *"
quote = "The key for mutes and the cooldown is `release:<country>:<release>`, for example `release:VD:CPI`."
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "format"
name = "a surprise's message"
value = "<LEVEL> <country> <release>: actual <a> vs consensus <c> (surprise <signed s>)"
quote = "WARNING VD CPI: actual 0.46% vs consensus 0.22% (surprise +0.24%)"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "format"
name = "a revision's message"
value = "<LEVEL> <country> <release>: actual <a>, previous revised from <p> to <r> (revision <signed r>)"
quote = "INFO XR TRADE_BALANCE: actual -14.6bn, previous revised from -12.4bn to -15.8bn (revision -3.4bn)"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "format"
name = "both reasons' message"
value = "the surprise's what, then the revision's, separated by a comma; both details likewise"
quote = "WARNING VD GDP: actual 0.31% vs consensus 0.45%, previous revised from 0.20% to 0.34% (surprise -0.14%, revision +0.14%)"
source = "room:docs/desk/release-alerts.md"

[[names]]
kind = "format"
name = "numbers"
value = "format.amount and format.signed: pct two decimals and %, k no decimals with thousands commas, bn one decimal; signs + and -"
quote = "amount() writes a figure in its unit, signed() a difference with its sign (+0.24%, -93k), and change() a move in words (up 0.24%, down 93k)."
source = "room:alertd/format.py"

[[names]]
kind = "rule"
name = "the existing settings"
value = "every existing key keeps its name; a config without release keys loads (the original config and a hidden one are used)"
quote = "A config file need only set the keys it changes; every other key takes its default from alertd/defaults.toml."
source = "room:alertd/config.py"

[[names]]
kind = "rule"
name = "the existing tests"
value = "the original tests/, examples/ and pyproject.toml restored over a copy of /app; every original test passes"
quote = "the tests in `tests/`, which will be run as they are."
source = "ticket"

[hints]
forbidden = ["consensus", "revision", "revised", "surprise", "critical", "stale", "escalate", "raise", "step", "null",
             "missing", "three times", "twice", "cooldown", "suppress", "suppression", "suppressions", "order",
             "ARCHITECTURE", "suppress.py", "format.py", "defaults.toml", "release.thresholds", "stale_after_minutes",
             "importance", "previous", "prefix"]

