# deliverbench's own settings for this job (Harbor's task.toml has no place for them). A v2 job (format 2):
# the evidence map, the name-and-rule list and the no-hint check below are checked by dbench/jobformat.py.
# The job plan: docs/job-plans/T11-PLAN.md; the tick list: docs/job-plans/T11-TICKLIST.md.
[job]
id = "T11"
title = "Price standard CDS the way the market does"
version = "0.1.2"
skill = "reading a published methodology and applying it exactly; numerical care; checking one's own numbers"
scored = true
format = 2
time_limit_min = 240   # SCORING section 6: 5 x the slowest honest trial run (170 min, all trial setups), rounded up to 5 minutes; 240 at most
runs_agent_code = true

# The job's levers (docs/job-plans/T11-PLAN.md, "Levers and settings"), frozen before its first model run. Set at
# the hard end (owner's decision, 22 Nov 2026): plain tie-outs only; hard hidden cases; the 0.5bp tolerance kept.
[settings]
trade_date = "2026-11-19"           # every priced contract; the discount curve is for this day
reference = "ISDA CDS Standard Model, C code v1.8.3 (zip sha256 bee02772...0db0)"
tie_outs = 4                        # quoted-spread conversions only: IG, 100bp coupon, 40% recovery, before 2033
hidden_schedules = 10               # 6 trade dates; 4 cross the 20 June 2033 holiday roll or start from it
hidden_upfronts = 16                # quoted spread to upfront: 6 IG, 10 HY (up to 1,000bp)
hidden_spreads = 16                 # upfront to quoted spread: 7 IG, 9 HY (up to 979bp, 20.5 points)
hidden_names = 6                    # curves: 3 steep, 2 inverted (high yield, one peaking at 900bp), 1 sparse
max_spread_bp = 1000                # no distressed name (owner's decision, 22 Nov): a pricer without the half-day
                                    # adjustment passes every hidden case (generate.py asserts it)
hidden_curve_contracts = 18         # between, on, before and after the names' quote maturities
spread_tolerance_bp = 0.5           # spreads; an upfront within what 0.5bp is worth on its contract
accrued_tolerance_usd = 0.01        # accrued premium and every coupon, to the cent
holiday_roll = "2033-06-20"         # Juneteenth observed on a coupon date: the coupon moves to 21 June
documents = 2                       # the methodology paper (local copy) and ISDA's numerical-fix note (fetched)

[[checks]]
id = "test_outputs::test_payment_schedules"
required = true

[[checks]]
id = "test_outputs::test_upfront_from_quoted_spread"
required = true

[[checks]]
id = "test_outputs::test_quoted_spread_from_upfront"
required = true

[[checks]]
id = "test_outputs::test_pricing_off_the_term_structure"
required = true

[[checks]]
id = "test_outputs::test_quoted_spread_off_the_term_structure"
required = true

# ----- the reference documents: never committed (house rule 4); dbench documents writes them into the room -----

[[documents]]
name = "okane-turnbull-2003"
title = "Valuation of Credit Default Swaps (O'Kane and Turnbull, Lehman Brothers, 2003)"
local_source = "the desk's own copy of the Lehman Brothers Quantitative Credit Research note of April 2003, which has no stable public address (the owner's choice, docs/job-plans/T11-PLAN.md)"
sha256 = "d82afbcc5d29d9380e9a6f7c6df34da4be6d81fafc1fd515451902589d530e0c"
room_file = "fetched/okane-turnbull-2003.txt"
text_sha256 = "4e13aab752b3a9bdc2cf769f64c7c524b927165052c278c1ce657019ceb6c523"
passages = [
  "The standard modeling assumption used in the credit default swap market is to assume that the hazard rate is a piecewise flat function of maturity time.",
  "It starts with taking the shortest maturity contract and using it to calculate the first survival probability.",
  "Beyond this, it is often assumed that the hazard rate is flat.",
  "It also includes the payment of premium accrued from the previous premium payment date until the time of the credit event.",
  "This is the breakeven spread, and is given by PV of Premium Leg = PV of Protection Leg.",
  "we typically assume that this payment is made immediately.",
  "Strictly speaking the timing of a credit event should not be resolved to less than a day.",
  "Contractual Spread 200bp Basis Actual 360",
]

[[documents]]
name = "isda-numerical-fix-2012"
title = "ISDA CDS Standard Model: Proposed Numerical Fix (Markit, 2012)"
url = "https://www.cdsmodel.com/assets/cds-model/docs/20121115_ISDA%20CDS%20Standard%20Model%20-%20Numerical%20Fix.pdf"
backup_url = "https://web.archive.org/web/20240808025323id_/https://www.cdsmodel.com/assets/cds-model/docs/20121115_ISDA%20CDS%20Standard%20Model%20-%20Numerical%20Fix.pdf"
sha256 = "e544d3848d1e92dd116d2b46930ae846580003d10f34c630b45d56d94a0dad69"
room_file = "fetched/isda-numerical-fix-2012.txt"
text_sha256 = "47a1cd928ed9caae2ec8a2dc57314934463ac8ee56ef0c29f79a16e131a07da1"
passages = [
  "The original ISDA Model calculates the accrual on default for each sub period using the following formula",
  "where t₀ and t₁ are start and end time of the period; S₀, S₁ and D₀,D₁ are the survival probabilities and discount factors until t₀ and t₁",
  "To remove the noise, we need to transform the equations and remove λ+f from denominators.",
  "Similar expansion can be applied to contingent leg calculation.",
  "the criteria we set to use the expansion is |Λ+F| <1×10-⁴",
]

