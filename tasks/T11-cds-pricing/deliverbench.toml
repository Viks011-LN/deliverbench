source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "coupon periods"
value = "from one moved coupon date to the next (excluded), paid on it"
quote = "Each coupon period starts on a coupon date, as moved, and accrues up to the next coupon date, as moved, which is the next period's first day and is not part of the period. The coupon is paid on that next coupon date."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "the last period"
value = "accrual end the day after the maturity date; paid on the maturity date moved to a business day"
quote = "The last period runs through the maturity date itself, so it accrues one day more than the days from its first day to the maturity date. It is paid on the maturity date, moved to the next business day if it is not one."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "day count of the premium"
value = "Actual/360"
quote = "The premium accrues on an Actual/360 basis: a period's coupon is the notional times the coupon rate times the period's days over 360."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "coupon paid on survival"
value = "survival to the end of the period's last accrual day; discounted from the payment date"
quote = "A coupon is paid on its payment date if the name survives to the end of the period's last day of accrual."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "premium accrued at default and the half-day adjustment"
value = "paid at the default, from the start of the period's first day to the default plus half a day; in the first period, defaults from the step-in date on"
quote = "The standard measures the time accrued from the start of the period's first day to the moment of default, and adds half a day: the standard's half-day adjustment. In the first period, only defaults from the step-in date on count, but the premium accrued still runs from the period's first day."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "accrued premium of an upfront"
value = "the current period's days from its first day through the trade date, Actual/360"
quote = "Because the buyer pays a whole first coupon, the seller pays back at cash settlement the premium accrued from the start of the current period up to the step-in date: the days from the period's first day through the trade date, on the same Actual/360 basis."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "recovery"
value = "given with each quote; (1 - recovery) of notional paid at the moment of default"
quote = "At a default the protection pays the notional times one minus the recovery rate, at the moment of default."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "time"
value = "calendar days from the trade date over 365, for discounting and survival"
quote = "Time, for discounting and for survival, is counted in calendar days from the trade date, over 365."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "the discount curve"
value = "continuously compounded zero rates (Actual/365 Fixed); flat forwards between pillars and before the first; the last forward after the last"
quote = "continuously compounded zero rates, on an Actual/365 Fixed basis, from the curve date to each pillar's date. The forward rate is flat between pillars and from the curve date to the first pillar; after the last pillar the last forward rate carries on."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "a name's credit curve"
value = "hazard rate flat between quote maturities, from the trade date, flat after the last; survival to the end of a day"
quote = "A name's credit curve has a hazard rate that is flat between the maturity dates of the name's quotes: from the trade date to the first quote's maturity, from each quote's maturity to the next, and after the last quote's maturity at the last piece's rate. Survival observed on a date means survival to the end of that day."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "fitting the curve"
value = "one maturity at a time, each quote a contract traded today worth nothing clean at a coupon equal to the quote"
quote = "The curve is fitted one maturity at a time, shortest first: each piece's hazard rate is set so that a contract traded today to that quote's maturity, at a coupon equal to the quote, is worth nothing clean, with the earlier pieces held fixed."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "par spread"
value = "the coupon with no clean upfront (valued at cash settlement); the curve gives back each quote"
quote = "A par spread is the coupon at which a contract traded today to that maturity would have no upfront before accrued premium, so the fitted curve gives back each quote exactly."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "valuation"
value = "exact in continuous time, piece by piece between the dates where either curve changes"
quote = "between the dates where the hazard rate or the forward rate changes, both are flat, and each piece of the protection leg and of the premium accrued at default is valued exactly, as in the numerical fix note's formulas."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "the numerical fix"
value = "the note's series where the hazard plus forward rate over a piece is under 1e-4 (moves no hidden answer by more than 0.0001bp)"
quote = "over a piece where the hazard rate and the forward rate add up to less than 1e-4 in absolute value (each taken as its total over the piece), the standard uses the note's series instead of the exact formula, for the premium accrued at default and for the protection leg."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "value date"
value = "upfronts valued at the cash settlement date"
quote = "Upfronts are values at the cash settlement date: the value at the trade date carried forward to the cash settlement date on the discount curve."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "rule"
name = "points, accrued and cash"
value = "points the clean value in percent; cash = notional x points / 100 - accrued; positive when the buyer pays"
quote = "An upfront is from the protection buyer's side, positive when the buyer pays. It is quoted in points: the clean value (before accrued premium) in percent of notional. The cash the buyer pays at cash settlement is the notional times the points, less the accrued premium the seller pays back."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "the quoting convention"
value = "one flat hazard rate fitted to the contract itself (its own dates, accrual start included) with its coupon set to the quoted spread"
quote = "The flat curve uses the contract's own dates (accrual start, step-in, cash settlement and maturity) and the name's recovery rate."
source = "room:docs/desk-conventions.md"

[[names]]
kind = "method"
name = "the quoted spread off a curve"
value = "the quoting convention's spread for the curve's upfront, not the par spread"
quote = "Its quoted spread is the quoting convention's spread for its upfront; it differs from the par spread whenever the curve is not flat."
source = "room:docs/desk-conventions.md"

[hints]
forbidden = ["hazard", "bootstrap", "accrual", "accrued", "half-day", "ACT/360", "Actual/360", "IMM", "step-in",
             "holiday", "holidays", "flat", "par spread", "series", "numerical fix", "Juneteenth"]

