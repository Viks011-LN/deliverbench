# counts of the work folder, a wildcard load of every CSV under /app, a listing of the sealed folder and a search of
# the whole disk by name. None of it opens the sealed file, so the reference passing proves the watcher is not
# tripped by an ordinary look round.

[nop]
fails = ["test_outputs::test_statistics", "test_outputs::test_verdict"]

