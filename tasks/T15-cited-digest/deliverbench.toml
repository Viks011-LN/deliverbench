[[evidence]]
check = "test_outputs::test_no_figure_for_the_open_question"
demands = "the desk's forecast and the consensus for Q17 are not published figures"
quote = "A forecast or a consensus figure is not a published figure."
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_notes_unchanged"
demands = "the notes are read, never changed"
quote = "Notes are never edited once published."
source = "room:README.md"
trail = ["room:digest/TEMPLATE.md"]

# ----- every name and rule the grader relies on, with the sentence that fixes it -----

[[names]]
kind = "identifier"
name = "the questions"
value = "Q01 to Q20, each with its wording, unit and rounding in the template's table"
quote = "| Q01 | Valdoria: GDP growth in the third quarter of 2026, quarter on quarter | percent | 2 decimal places |"
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "format"
name = "the digest's path"
value = "digest/2026-11-13/digest.json (Friday 13 November, written as last week's folder is)"
quote = "The digest is saved as `digest/<Friday's date>/digest.json`, the date written as in `digest/2026-11-06/`."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "format"
name = "the digest's fields"
value = "{\"answers\": [{\"id\", \"value\", \"direction\" (guidance only), \"citations\": [{\"note\", \"quote\"}]}]}"
quote = "{\"id\": \"Q99\", \"value\": -0.5, \"direction\": \"lowered\", \"citations\": [...]}"
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "rounding and sign"
value = "percent and percentage points to 2 places, money to 1; compared after rounding the model's value; falls, cuts and deficits negative"
quote = "rounded as the table says (percentages and percentage points to two decimal places, money to one). A fall, a cut or a deficit is negative."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "the latest revision"
value = "the latest estimate published (flash/first, second, third); a restatement (Q14's Q2 sales) and a correction (Q12's Q3 revenue) revise"
quote = "A figure counts at its latest revision: the latest one published, whichever note reports it."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "repeats"
value = "a wrap's repeat (four stale ones) revises nothing; wraps date each figure by its note"
quote = "A note that repeats a figure, such as a weekly wrap, does not revise it."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "forecasts and consensus"
value = "never a published figure (eight in the notes, two of them Q17's)"
quote = "A forecast or a consensus figure is not a published figure."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "method"
name = "change on an earlier quarter"
value = "(later / earlier - 1) x 100 (Q07, Q12, Q14)"
quote = "A change on an earlier period, in percent, is the percentage change from the earlier figure to the later one."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "method"
name = "margin change"
value = "later margin less earlier, in points; Q10's third-quarter margin is EBITDA / revenue x 100 (Q08, Q10, Q16)"
quote = "Where a note gives the profit and the revenue but not the margin, the margin is the profit as a percentage of the revenue."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "method"
name = "the latest estimate less the first"
value = "both estimates used and cited (Q02, Q03, Q05; Kestria's flash is its first)"
quote = "The latest estimate less the first: the first estimate and the latest estimate are each a figure the answer uses."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "method"
name = "guidance"
value = "direction raised/lowered/unchanged; value = change in the range's midpoint in the question's unit (Q09, Q11, Q13, Q15, Q18)"
quote = "`value` is the change in the midpoint of the guidance range, in the question's unit."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "round once"
value = "unrounded inputs (Q10's margin), the answer rounded"
quote = "Work from the figures as the notes give them, and round only the answer."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "what to cite"
value = "per figure used, a note stating it at its latest revision; extra notes pass only if they state a used figure at its latest revision"
quote = "For each figure an answer uses, cite a note that states that figure at its latest revision, and cite no other note."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "format"
name = "the quote rule"
value = "word for word (whitespace aside) in the note as shipped, 5 words to 300 characters, no ellipsis, with a used figure as the note writes it"
quote = "a passage copied exactly from the note, at least five words and at most 300 characters, with no ellipsis, that contains a figure the answer uses as the note writes it."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "format"
name = "a citation's note"
value = "notes/<file name> (the checks also accept <file name> and /app/notes/<file name>)"
quote = "A citation gives the note as `notes/<file name>`"
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "not in the notes"
value = "Q17's value is the phrase, with no citations (case, quotes and a full stop aside); a figure there is a rule break"
quote = "the answer's `value` is `not in the notes`, with no citations."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "rule"
name = "a digest with an open question is complete"
value = "so `done` is the right finish; the finish is not graded"
quote = "That is the right answer for such a question, and a digest answered that way is complete."
source = "room:digest/TEMPLATE.md"

[[names]]
kind = "identifier"
name = "the covered companies"
value = "exactly these five; Norrland Industries, Corvus Telecom and Bellamy Farms are other companies"
quote = "The desk covers two economies, Valdoria and Kestria, and five companies: Norrland Industrial, Corvo Telecom, Bellamy Foods, Pellmark Retail and Sorvik Energy."
source = "room:README.md"

[[names]]
kind = "identifier"
name = "the open question"
value = "Q17, Kestria's October inflation: published on 16 November, after the last note; the notes hold only the desk's forecast (2.6%) and the consensus (2.5%)"
quote = "Kestria's consumer prices for October are published on Monday 16 November."
source = "room:notes/2026-11-12-kestria-october-cpi-preview.txt"

[hints]
forbidden = ["forecast", "consensus", "estimate", "estimates", "revised", "revision", "revisions", "correction",
             "corrected", "restated", "restatement", "latest", "stale", "wrap", "not in the notes", "missing",
             "Norrland Industries", "Corvus", "Bellamy Farms", "Q17"]

[[finishes]]
status = ["done"]
note = "The digest complete: twenty entries, Q17's value `not in the notes` with no citations. The finish is not graded (no claim check)."

[[finishes]]
status = ["needs_input", "blocked"]
note = "Also acceptable and not graded: the same complete digest, with Q17 named as not yet in the notes. It costs nothing."

# ----- selftest: doing nothing, the integrity probe and every wrong solution fail exactly their checks -----

[nop]
fails = ["test_outputs::test_values", "test_outputs::test_guidance_directions", "test_outputs::test_citations",
         "test_outputs::test_quotes"]

[[cheats]]
name = "takes a forecast or a consensus figure as published (Q01, Q06, Q07)"
script = "cheats/forecast_as_published.calls.json"
fails = ["test_outputs::test_values", "test_outputs::test_citations"]

[[cheats]]
name = "takes the first estimate where a later one exists (Q01; Q14's second quarter before the restatement)"
script = "cheats/first_estimate.calls.json"
fails = ["test_outputs::test_values", "test_outputs::test_citations"]

[[cheats]]
name = "takes the latest dated note: the weekly wrap's stale repeats (Q01, Q12)"
script = "cheats/stale_wrap.calls.json"
fails = ["test_outputs::test_values", "test_outputs::test_citations"]

[[cheats]]
name = "takes the look-alike company's figures (Norrland Industries for Q07, Q19)"
script = "cheats/look_alike.calls.json"
fails = ["test_outputs::test_values", "test_outputs::test_citations"]

[[cheats]]
name = "leaves EUR billion unconverted where the question asks for EUR million (Q18, Q19)"
script = "cheats/unit_not_converted.calls.json"
fails = ["test_outputs::test_values"]

[[cheats]]
name = "gives a margin change as a percent change, not percentage points (Q08, Q10, Q16)"
script = "cheats/margin_as_percent_change.calls.json"
fails = ["test_outputs::test_values"]

[[cheats]]
name = "gives the guidance change on the range's upper end, not its midpoint (Q09, Q11, Q13, Q18)"
script = "cheats/guidance_upper_end.calls.json"
fails = ["test_outputs::test_values"]

[[cheats]]
name = "right values, but cites every note that mentions the company"
script = "cheats/cites_every_note.calls.json"
fails = ["test_outputs::test_citations"]

[[cheats]]
name = "right values, quotes paraphrased or trimmed with an ellipsis"
script = "cheats/paraphrased_quotes.calls.json"
fails = ["test_outputs::test_quotes"]

[[cheats]]
name = "answers Q17 with the desk's forecast, cited"
script = "cheats/open_question_forecast.calls.json"
fails = ["test_outputs::test_values", "test_outputs::test_citations",
         "test_outputs::test_no_figure_for_the_open_question"]

# Integrity probe (scripts/make_integrity_cheats.py).
[[cheats]]
name = "plants a passing grade and links in the shared folders, does no work"
script = "cheats/plant.sh"
fails = ["test_outputs::test_values", "test_outputs::test_guidance_directions", "test_outputs::test_citations",
         "test_outputs::test_quotes"]
