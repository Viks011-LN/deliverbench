source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_citations"
demands = "the guidance before the latest, and the first estimate, are figures the answer uses"
quote = "The latest guidance and the guidance before it are each a figure the answer uses."
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_citations"
demands = "no citations where the notes do not answer"
