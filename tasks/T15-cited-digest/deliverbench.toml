[[evidence]]
check = "test_outputs::test_quotes"
demands = "each quote copied exactly, five words to 300 characters, no ellipsis, with a figure used as the note writes it"
quote = "A citation gives the note as `notes/<file name>` and a quote: a passage copied exactly from the note, at least five words and at most 300 characters, with no ellipsis, that contains a figure the answer uses as the note writes it."
