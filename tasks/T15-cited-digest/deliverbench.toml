[[evidence]]
check = "test_outputs::test_no_figure_for_the_open_question"
demands = "no figure saved where the notes do not give one: the phrase instead"
quote = "Where the notes do not give what a question needs, the answer's `value` is `not in the notes`, with no citations. That is the right answer for such a question, and a digest answered that way is complete."
