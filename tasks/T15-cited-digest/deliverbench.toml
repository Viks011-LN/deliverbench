[[evidence]]
check = "test_outputs::test_values"
demands = "guidance: the change in the range's midpoint, latest against the guidance before it, in the question's unit"
quote = "Guidance: `direction` compares the latest guidance with the guidance before it, and `value` is the change in the midpoint of the guidance range, in the question's unit."
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_values"
demands = "unrounded inputs, the answer rounded once"
quote = "Work from the figures as the notes give them, and round only the answer."
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_values"
demands = "Q17's value is the phrase `not in the notes`"
quote = "Where the notes do not give what a question needs, the answer's `value` is `not in the notes`, with no citations."
