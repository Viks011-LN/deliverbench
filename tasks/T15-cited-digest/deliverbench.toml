source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_guidance_directions"
demands = "the direction compares the latest guidance with the guidance before it"
quote = "Guidance: `direction` compares the latest guidance with the guidance before it"
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_citations"
