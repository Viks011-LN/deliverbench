[[evidence]]
check = "test_outputs::test_values"
demands = "a margin change in percentage points, the margin worked out from profit and revenue where no note gives it"
quote = "A change in a margin, in percentage points, is the later margin less the earlier one. Where a note gives the profit and the revenue but not the margin, the margin is the profit as a percentage of the revenue."
source = "room:digest/TEMPLATE.md"

[[evidence]]
check = "test_outputs::test_values"
demands = "the latest estimate less the first"
quote = "The latest estimate less the first: the first estimate and the latest estimate are each a figure the answer uses."
